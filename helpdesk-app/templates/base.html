<!DOCTYPE html>
<html>
<head>
    <title>Company Helpdesk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        .navbar { background: #1a1a2e; padding: 15px 30px; display: flex; align-items: center; gap: 30px; }
        .navbar h1 { color: white; font-size: 20px; }
        .navbar a { color: #aaa; text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 4px; }
        .navbar a:hover { background: #16213e; color: white; }
        .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .card h2 { font-size: 16px; margin-bottom: 15px; color: #333; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-open { background: #fff3cd; color: #856404; }
        .badge-in-progress { background: #cce5ff; color: #004085; }
        .badge-closed { background: #d4edda; color: #155724; }
        .badge-high { background: #f8d7da; color: #721c24; }
        .badge-medium { background: #fff3cd; color: #856404; }
        .badge-low { background: #d4edda; color: #155724; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-success { background: #28a745; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-size: 13px; color: #666; }
        .online { color: #28a745; font-weight: bold; }
        .offline { color: #dc3545; font-weight: bold; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .stat-card { background: white; border-radius: 8px; padding: 20px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .stat-card .number { font-size: 36px; font-weight: bold; color: #0066cc; }
        .stat-card .label { font-size: 13px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🖥️ Company Helpdesk</h1>
        <a href="/">Dashboard</a>
        <a href="/tickets">All Tickets</a>
        <a href="/tickets/new">New Ticket</a>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
