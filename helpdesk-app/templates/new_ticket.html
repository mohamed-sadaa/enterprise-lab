{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:600px">
    <h2>🎫 Create New Ticket</h2><br>
    <form method="POST">
        <div style="margin-bottom:15px">
            <label style="display:block;margin-bottom:5px;font-size:14px">Title</label>
            <input type="text" name="title" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px">
        </div>
        <div style="margin-bottom:15px">
            <label style="display:block;margin-bottom:5px;font-size:14px">Description</label>
            <textarea name="description" rows="4" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px"></textarea>
        </div>
        <div style="margin-bottom:15px">
            <label style="display:block;margin-bottom:5px;font-size:14px">Priority</label>
            <select name="priority" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
            </select>
        </div>
        <div style="margin-bottom:20px">
            <label style="display:block;margin-bottom:5px;font-size:14px">Assign To</label>
            <select name="assigned_to" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px">
                <option>john.it</option>
                <option>sara.hr</option>
                <option>mike.finance</option>
                <option>Unassigned</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Create Ticket</button>
        <a href="/tickets" class="btn" style="background:#6c757d;color:white;margin-left:10px">Cancel</a>
    </form>
</div>
{% endblock %}
